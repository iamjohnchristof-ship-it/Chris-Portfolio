    <style>
        .flex-row {
            display: flex;
            flex-direction: row;
            align-items: stretch;
            justify-content: space-between;
            gap: 24px;
            width: 100%;
            max-width: 950px;
            margin-bottom: 35px;

        .flex-row .welcome-card {
            flex: 2;
            margin-bottom: 0;
            background-color: rgba(30, 30, 30, 0.72);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }

        .flex-buttons {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 12px;
        }

        .flex-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px 18px;
            background-color: rgba(26, 26, 26, 0.75);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            color: #ffe700;
            text-decoration: none;
            font-weight: bold;
            border: 1px solid #ffe700;
            border-radius: 8px;
        }

        .flex-btn:hover {
            background-color: #ffe700;
            color: #000000;
        }

        .cursor {
            display: inline-block;
            color: #ffe700;
            font-weight: bold;
            animation: blink 0.8s infinite;
        }

        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        @media (max-width: 768px) {
            .flex-row {
                flex-direction: column;
            }
        }
    </style>
</head>

    <script>
        const introText = "Hello! I'm CHRISTOF SORIANO, a TVL-ICT student at Gov. Juanito Reyes Remulla Senior High School. This personal website showcases the projects, activities, and skills I have built throughout this semester.";
        const aboutText = "Built using HTML, CSS, and JavaScript, this portfolio highlights my coding exercises and web design projects. Feel free to explore and check out my work! Inside, you'll find interactive JavaScript tools, responsive layouts, custom logic calculators, and hands-on activities I've developed while sharpening my front-end development skills.";

        const introEl = document.getElementById("typed-intro");
        const aboutEl = document.getElementById("typed-about");
        const cursor = document.createElement("span");
        cursor.className = "cursor";
        cursor.textContent = "|";

        function typeText(element, text, speed, done) {
            let i = 0;
            element.textContent = "";
            element.appendChild(cursor);

            function step() {
                if (i < text.length) {
                    cursor.insertAdjacentText("beforebegin", text.charAt(i));
                    i++;
                    setTimeout(step, speed);
                } else if (done) {
                    done();
                }
            }
            step();
        }

        typeText(introEl, introText, 22, () => {
            typeText(aboutEl, aboutText, 22);
        });
    </script>
