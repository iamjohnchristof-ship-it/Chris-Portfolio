    <style> 
        body { 
          font-family: Arial, sans-serif; 
          background: #121212; 
          margin: 0; 
          padding: 0; 
          min-height: 100vh;
          display: flex;
          flex-direction: column;
        } 

        main {
          flex: 1;
          padding: 20px;
        }
  
        h1 { text-align: center; color: #ffe700; } 
  
        .carousel { 
          width: 90%;
          max-width: 900px; 
          margin: 20px auto; 
          align-self: center;
        } 
  
        .slides { 
          position: relative; 
          aspect-ratio: 16 / 9;     
          overflow: hidden; 
          background: #000; 
          border-radius: 8px; 
          border: 2px solid #ffe700;
        } 
  
        .slide { 
          position: absolute;         
          inset: 0; 
          margin: 0; 
        } 
  
        .slide img { 
          width: 100%; 
          height: 100%; 
          object-fit: cover;        
          display: block; 
        } 
         .slide figcaption { 
          position: absolute; 
          left: 0; right: 0; bottom: 0; 
          padding: 12px 16px; 
          background: rgba(0, 0, 0, 0.65); 
          color: #ffe700; 
          font-weight: bold;
        } 
  
        .nav { 
          position: absolute; 
          top: 50%; 
          transform: translateY(-50%); 
          z-index: 5; 
          border: none; 
          background: rgba(0, 0, 0, 0.5); 
          color: #fff; 
          font-size: 24px; 
          padding: 10px 14px; 
          cursor: pointer; 
        } 
        .nav:hover { background: rgba(0, 0, 0, 0.8); color: #ffe700; } 
        .prev { left: 8px; } 
        .next { right: 8px; } 
  
        .dots { text-align: center; padding: 12px 0; } 
  
        .dot { 
          width: 12px; 
          height: 12px; 
          margin: 0 5px; 
          padding: 0; 
          border: none; 
          border-radius: 50%; 
          background: #555555; 
          cursor: pointer; 
        } 
        .dot.active { background: #ffe700; } 
    </style> 
</head> 
<body>

    <main>
        <div class="carousel" id="carousel"> 
          <div class="slides"> 
            <figure class="slide"> 
              <img src="Family2.jpg"> 
              <figcaption>My Father side Family</figcaption> 
            </figure> 
            <figure class="slide"> 
              <img src="https://static0.topspeedimages.com/wordpress/wp-content/uploads/jpg/201506/kawasaki-ninja-h2r-t.jpg"> 
              <figcaption>Kawasaki Ninja h2r</figcaption> 
            </figure> 
            <figure class="slide"> 
              <img src="https://images.carandbike.com/cms/articles/3201985/articles/3202126/A3_OLIG_557_ZB_55_JSGAQ_57_WOC_6_IM_2022_09_09_T11_40_09_162_Z_9f2e1a2e5e.jpg"> 
              <figcaption>BMW s1000rr</figcaption> 
            </figure> 
            <figure class="slide"> 
              <img src="https://www.gearpatrol.com/wp-content/uploads/sites/2/2025/11/CFMoto-V4-SR-RR-8.jpg.webp?w=1920" alt="Describe image 4"> 
              <figcaption>CFMOTO V4SR-RR</figcaption> 
            </figure> 
      
            <button class="nav prev" type="button" aria-label="Previous slide">&#10094;</button> 
            <button class="nav next" type="button" aria-label="Next slide">&#10095;</button> 
          </div> 
      
          <div class="dots"></div> 
        </div> 
    </main>
  
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script> 
    <script> 
    $(document).ready(function () { 
      const $carousel = $("#carousel"); 
      const $slides   = $carousel.find(".slide"); 
      const $dotsBox  = $carousel.find(".dots"); 
      const total     = $slides.length; 
      const FADE_TIME = 700;      
      const DELAY     = 4000;    
      let current     = 0;      
      let timer       = null;   
  
      $slides.hide().eq(0).show(); 

      $slides.each(function (i) { 
        $("<button>") 
          .attr({ type: "button", "aria-label": "Go to slide " + (i + 1) }) 
          .addClass("dot" + (i === 0 ? " active" : "")) 
          .data("index", i) 
          .appendTo($dotsBox); 
      }); 
      const $dots = $dotsBox.find(".dot"); 

      function showSlide(index) { 
        if (index === current) return;                  
          
        $slides.eq(current).stop(true, true).fadeOut(FADE_TIME); 
        $slides.eq(index).stop(true, true).fadeIn(FADE_TIME); 
        $dots.removeClass("active").eq(index).addClass("active"); 
  
        current = index; 
      } 
  
      function nextSlide() { showSlide((current + 1) % total); } 
      function prevSlide() { showSlide((current - 1 + total) % total); } 
  
      $carousel.on("click", ".next", nextSlide); 
      $carousel.on("click", ".prev", prevSlide); 
      $dotsBox.on("click", ".dot", function () { 
        showSlide($(this).data("index")); 
      }); 

      function startAutoplay() { 
        stopAutoplay();                                   
        timer = setInterval(nextSlide, DELAY); 
      } 
      function stopAutoplay() { 
        clearInterval(timer); 
      } 
      $carousel.on("mouseenter", stopAutoplay) 
      .on("mouseleave", startAutoplay); 
      startAutoplay(); 
  
      $(document).on("keydown", function (event) { 
        if (event.key === "ArrowRight") { 
          nextSlide(); 
        } else if (event.key === "ArrowLeft") { 
          prevSlide(); 
        } 
      }); 
    }); 
    </script>
