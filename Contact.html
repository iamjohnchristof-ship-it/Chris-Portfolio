<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHRIZ CORP - Contact</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #121212;
            background-image: url("Backgroundguns.jpg") !important;
            background-size: cover !important;
            background-position: center !important;
            background-repeat: no-repeat !important;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Navigation Bar - Left-Aligned Gold / Black Theme */
        nav {
            background: gold;
            width: 100%;
            display: flex;
            flex-direction: row;
            justify-content: flex-start;
            align-items: center;
            padding: 0 10px;
            gap: 0;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.25);
        }

        nav a {
            display: flex;
            align-items: center;
            color: #000000;
            text-decoration: none;
            padding: 14px 20px;
            font-size: 15px;
            font-weight: 600;
            transition: background 0.2s, color 0.2s;
        }

        nav a:hover {
            background: #000000;
            color: gold;
        }

        nav a.active {
            background: #000000;
            color: #ffe700;
            border-bottom: 4px solid #ffe700;
        }

        /* Page Header - Matches Gold / Dark Gray / Black Theme */
        header {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(26, 26, 26, 0.75);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            text-align: center;
            padding: 35px 20px;
            border-bottom: 4px solid #ffe700;
            opacity: 0;
            animation: fadeDown 0.5s ease forwards;
        }

        header h1 {
            color: #ffe700;
            font-size: 32px;
            letter-spacing: 0.5px;
        }

        /* Main Content */
        .container {
            max-width: 700px;
            width: 100%;
            margin: 50px auto;
            padding: 0 30px;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Contact Card */
        .contact-card {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            background: rgba(30, 30, 30, 0.72);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            padding: 45px 35px;
            text-align: center;
            border-radius: 12px;
            border: 1px solid rgba(255, 231, 0, 0.35);
            border-top: 6px solid #ffe700;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.45);
            opacity: 0;
            animation: cardRise 0.6s ease forwards;
            animation-delay: 0.15s;
        }

        .contact-card h2 {
            font-size: 28px;
            color: #ffe700;
        }

        .contact-card > p {
            font-size: 16px;
            color: #e5e5e5;
            line-height: 1.6;
        }

        .contact-info {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 16px;
            background: rgba(18, 18, 18, 0.65);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 16px;
            color: #f0f0f0;
        }

        .info-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .info-row strong {
            color: #ffe700;
        }

        /* Social Links */
        .social-links {
            width: 100%;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 18px;
            flex-wrap: wrap;
            margin-top: 6px;
        }

            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 170px;
            padding: 13px 24px;
