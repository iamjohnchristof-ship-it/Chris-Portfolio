<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cardthemecanva</title>
  <style>
    body {
      background-color: rgb(122, 114, 114);
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
    }

    canvas {
      border: 2px solid #ffd166;
      background-color: #0b132b;
      max-width: 100%;
      height: auto;
    }
  </style>
</head>
<body>
  <canvas id="Cardthemecanva" width="1100" height="650"></canvas>

  <script>
    const canvas = document.getElementById("Cardthemecanva");
    const ctx = canvas.getContext("2d");

    ctx.beginPath();
    ctx.arc(140, 125, 45, 0, Math.PI * 2);
    ctx.fillStyle = "#fefae0";
    ctx.fill();

    ctx.beginPath();
    ctx.arc(160, 115, 38, 0, Math.PI * 2);
    ctx.fillStyle = "#0b132b";
    ctx.fill();

   function drawWhiteSnow() {
      for (let i = 0; i < 65; i++) {
       
        const x = Math.random() * canvas.width;
        const y = Math.random() * 540;

       
        const radius = Math.random() * 3 + 2;

     
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.closePath();
        ctx.fill();
      }
    }

    ctx.fillStyle = "#e2e8f0";
    ctx.fillRect(0, 535, 1100, 115);

    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 565, 1100, 85);

  
    ctx.fillStyle = "#5c3a21";
    ctx.fillRect(725, 470, 50, 85);

    function drawTier(topY, leftX, rightX, bottomY, color) {
      ctx.beginPath();
      ctx.moveTo(750, topY);
      ctx.lineTo(leftX, bottomY);
      ctx.lineTo(rightX, bottomY);
      ctx.closePath();
      ctx.fillStyle = color;
      ctx.fill();
    }

    drawTier(260, 580, 920, 475, "#1b4332");
    drawTier(165, 610, 890, 345, "#2d6a4f");
    drawTier(80, 645, 855, 225, "#40916c");

    ctx.beginPath();
    ctx.moveTo(750, 42);
    ctx.lineTo(758, 62);
    ctx.lineTo(778, 62);
    ctx.lineTo(762, 74);
    ctx.lineTo(768, 94);
    ctx.lineTo(750, 82);
    ctx.lineTo(732, 94);
    ctx.lineTo(738, 74);
    ctx.lineTo(722, 62);
    ctx.lineTo(742, 62);
    ctx.closePath();
    ctx.fillStyle = "#ffd166";
    ctx.fill();

    const ornaments = [
      { x: 750, y: 140, r: 9, color: "#ef476f" },
      { x: 715, y: 195, r: 9, color: "#ffd166" },
      { x: 785, y: 195, r: 9, color: "#06d6a0" },
      { x: 750, y: 260, r: 10, color: "#118ab2" },
      { x: 680, y: 315, r: 10, color: "#ef476f" },
      { x: 820, y: 315, r: 10, color: "#ffd166" },
      { x: 750, y: 380, r: 11, color: "#06d6a0" },
      { x: 650, y: 440, r: 11, color: "#ffd166" },
      { x: 750, y: 445, r: 11, color: "#ef476f" },
      { x: 850, y: 440, r: 11, color: "#118ab2" }
    ];
    ornaments.forEach(({ x, y, r, color }) => {
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();
    });

    function drawGift(x, y, w, h, boxColor, ribbonColor) {
      ctx.fillStyle = boxColor;
      ctx.fillRect(x, y, w, h);

      ctx.fillStyle = ribbonColor;
      ctx.fillRect(x + w / 2 - 5, y, 10, h);
      ctx.fillRect(x, y + h / 2 - 5, w, 10);
    }

    drawGift(540, 505, 60, 75, "#e63946", "#ffd166");
    drawGift(620, 520, 70, 65, "#118ab2", "#ffffff");
    drawGift(790, 525, 70, 60, "#06d6a0", "#ef476f");
    drawGift(880, 510, 65, 75, "#ff9f1c", "#ffffff");
    
    ctx.strokeStyle = "Gold";
    ctx.lineWidth = 3;
    ctx.strokeRect(20, 20, 1060, 610);

    ctx.fillStyle = "#ffd166";
    ctx.font = "bold 50px Georgia, serif";
    ctx.textAlign = "center";
    ctx.fillText("MERRY", 295, 300);
    ctx.fillText("CHRISTMAS!", 295, 360);

    ctx.fillStyle = "#e2e8f0";
    ctx.font = "italic 22px Georgia, serif";

    drawWhiteSnow();
  </script>
</body>
</html>
