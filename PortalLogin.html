<!DOCTYPE html>
<html>
<head>
    <title>Portal Login</title>
    <a href = "LandingPage.html"> Home </a>
    <style>
        body {
            background-color: #e8f5e9;
            font-family: Arial, sans-serif;
        }
        .login-box {
            width: 420px;
            margin: 30px auto;
            border: 2px solid #2e5930;
            background-color: #f9f9f9;
        }
        .header {
            background-color: #2e5930;
            color: white;
            padding: 12px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
        }
        table {
            width: 100%;
            padding: 20px;
        }
        td {
            padding: 8px 5px;
        }
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 8px;
            background-color: #f0f6e9;
            border: 1px solid #999;
            box-sizing: border-box;
        }
        .btn-login {
            background-color: #2e5930;
            color: white;
            border: none;
            padding: 8px 20px;
            margin: 0 5px;
        }
        .btn-clear {
            background-color: #81b984;
            color: white;
            border: none;
            padding: 8px 20px;
            margin: 0 5px;
        }
        .footer {
            text-align: center;
            color: #2e5930;
            padding: 12px;
            font-size: 15px;
        }
        .signup-link {
            text-align: center;
            margin: 10px 0 20px;
        }
        a {
            color: #2e5930;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="login-box">
    <div class="header">Portal Login</div>

    <form>
        <table>
           
            <tr>
                <td>Email:</td>
                <td><input type="text" placeholder="Enter Gmail"></td>
            </tr>
        
            <tr>
                <td>Password:</td>
                <td><input type="password" placeholder="Enter Password"></td>
            </tr>
        
            <tr>
                <td colspan="2" align="center" style="padding-top: 10px;">
                    <input type="submit" value="Login" class="btn-login">
                    <input type="reset" value="Clear" class="btn-clear">
                </td>
            </tr>
        </table>
    </form>

    <div class="footer">
        Created by: Christof soriano
    </div>
</div>

</body>
</html>
